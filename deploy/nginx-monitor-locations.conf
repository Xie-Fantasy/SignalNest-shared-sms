# SMS gateway web monitor.
# Include ONLY inside the existing dedicated 443 server block in
# /www/server/panel/vhost/nginx/sms-gateway-tls.conf, before `location /`.
# Never add this to the original IP site (houde-orbit.conf).

location = /monitor {
    return 301 /monitor/;
}

location = /monitor/index.html {
    root /opt/sms-monitor/www;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}

location /monitor/api/ {
    proxy_pass http://127.0.0.1:18101/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    client_max_body_size 8k;
    access_log off;
}

# PWA manifest: nginx has no built-in MIME mapping for .webmanifest.
location = /monitor/site.webmanifest {
    root /opt/sms-monitor/www;
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Brand icons are cacheable; hashed JS/CSS keep the no-store SPA behaviour.
location ~ ^/monitor/(favicon[^/]*\.(ico|png)|apple-touch-icon\.png|android-chrome-\d+x\d+\.png|browserconfig\.xml)$ {
    root /opt/sms-monitor/www;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

location /monitor/ {
    root /opt/sms-monitor/www;
    index index.html;
    try_files $uri $uri/ /monitor/index.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
